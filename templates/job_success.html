
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHire | Job Published Successfully</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: #172554;
            background: #e8edff;
        }

        /* Navigation */
        .navbar {
            background: rgba(255,255,255,0.97);
            padding: 12px 5%;
            box-shadow: 0 3px 20px rgba(20,40,90,0.08);
        }

        .brand {
            font-size: 27px;
            font-weight: 800;
            color: #155eef;
            text-decoration: none;
        }

        .brand i {
            margin-right: 8px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: #172554;
            font-weight: 600;
        }

        .logout-btn {
            border: 1px solid #155eef;
            color: #155eef !important;
            padding: 9px 18px;
            border-radius: 10px;
        }

        /* Background */
        .success-section {
            min-height: calc(100vh - 65px);
            padding: 30px 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(
                    120deg,
                    rgba(48,75,180,0.55),
                    rgba(105,105,235,0.45)
                ),
                url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=1800&auto=format&fit=crop");
            background-size: cover;
            background-position: center;
        }

        /* Main card */
        .success-card {
            width: 100%;
            max-width: 950px;
            padding: 30px 45px 28px;
            border-radius: 25px;
            text-align: center;
            background: rgba(255,255,255,0.96);
            box-shadow: 0 20px 60px rgba(15,35,100,0.22);
            animation: appear 0.7s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Success icon */
        .success-icon {
            width: 76px;
            height: 76px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #20bd79;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 0 0 10px #e0f8ec;
            animation: pop 0.6s ease;
        }

        @keyframes pop {
            0% { transform: scale(0.5); }
            70% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        .success-card h1 {
            font-size: clamp(26px, 3.5vw, 38px);
            font-weight: 800;
            margin-bottom: 12px;
            color: #14285e;
        }

        .success-card h1 span {
            color: #159b60;
        }

        .subtitle {
            font-size: 16px;
            color: #526484;
            line-height: 1.7;
            margin-bottom: 10px;
        }

        /* Illustration */
        .illustration {
            margin: 12px auto 18px;
            max-width: 340px;
        }

        .illustration img {
            width: 100%;
            height: 175px;
            object-fit: contain;
        }

        /* Buttons */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .btn-primary-custom,
        .btn-outline-custom {
            min-width: 235px;
            padding: 13px 22px;
            border-radius: 11px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-primary-custom {
            background: #1059f7;
            color: white;
        }

        .btn-primary-custom:hover {
            background: #083fc1;
            color: white;
            transform: translateY(-3px);
        }

        .btn-outline-custom {
            border: 2px solid #1059f7;
            color: #1059f7;
        }

        .btn-outline-custom:hover {
            background: #1059f7;
            color: white;
            transform: translateY(-3px);
        }

        .footer-text {
            font-size: 12px;
            color: #718096;
            margin: 20px 0 0;
        }

        /* Mobile */
        @media(max-width: 600px) {
            .navbar {
                padding: 12px 4%;
            }

            .brand {
                font-size: 21px;
            }

            .nav-links {
                gap: 12px;
            }

            .nav-links .optional-link,
            .nav-user {
                display: none;
            }

            .success-section {
                padding: 22px 12px;
            }

            .success-card {
                padding: 28px 18px;
            }

            .illustration img {
                height: 135px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn-primary-custom,
            .btn-outline-custom {
                width: 100%;
            }
        }

        @media(max-height: 750px) and (min-width: 601px) {
            .success-section {
                padding: 15px;
            }

            .success-card {
                padding: 20px 35px;
            }

            .illustration {
                margin: 5px auto 10px;
            }

            .illustration img {
                height: 125px;
            }

            .footer-text {
                margin-top: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container-fluid d-flex justify-content-between align-items-center">

            <a href="/" class="brand">
                <i class="fa-solid fa-briefcase"></i>SmartHire
            </a>

            <div class="nav-links">

                <a href="{{ url_for('recruiter_dashboard') }}" class="optional-link">
                    <i class="fa-solid fa-house"></i> Dashboard
                </a>

                <span class="nav-user fw-semibold">
                    <i class="fa-solid fa-circle-user"></i>
                    {{ current_user.full_name }}
                </span>

                <a href="{{ url_for('logout') }}" class="logout-btn">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </a>

            </div>
        </div>
    </nav>

    <!-- Success Content -->
    <section class="success-section">

        <div class="success-card">

            <div class="success-icon">
                <i class="fa-solid fa-check"></i>
            </div>

            <h1>
                Job Published <span>Successfully!</span>
            </h1>

            <p class="subtitle">
                Your job has been posted and is now live on SmartHire.<br>
                Qualified candidates can start applying right away.
            </p>

            <div class="illustration">
                <img
                    src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                    alt="SmartHire successful job posting">
            </div>

            <div class="action-buttons">

                <a href="{{ url_for('recruiter_dashboard') }}"
                   class="btn-primary-custom">
                    <i class="fa-solid fa-briefcase"></i>
                    View My Dashboard
                </a>

                <a href="{{ url_for('post_job') }}"
                   class="btn-outline-custom">
                    <i class="fa-solid fa-plus"></i>
                    Post Another Job
                </a>

            </div>

            <p class="footer-text">
                © 2026 SmartHire | AI-Powered All-in-One Job Portal Platform
            </p>

        </div>

    </section>

</body>
</html>
